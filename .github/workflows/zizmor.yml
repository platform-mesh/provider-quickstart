name: Zizmor
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    uses: platform-mesh/.github/.github/workflows/job-zizmor.yml@e5c329452c75be3225c3ec31cf1f6f7b7f44d550 # main # zizmor: ignore[stale-action-refs]
    with:
      persona: 'auditor'
    permissions:
      security-events: write # Needed to write to the GitHub Security tab
      contents: read # Needed to read repository contents
      actions: read # Needed to read GitHub Actions workflows
